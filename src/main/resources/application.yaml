spring:
  application:
    name: esep-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esep}
    username: ${DB_USERNAME:esep}
    password: ${DB_PASSWORD:esep}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
