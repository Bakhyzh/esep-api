          "target": "/opt/java/openjdk/lib/security/cacerts",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backplane"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:size=32m,mode=1777"
      ],
      "cap_drop": [
        "ALL"
