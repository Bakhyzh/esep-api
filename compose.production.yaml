      ],
      "stop_grace_period": "45s",
      "mem_limit": "64m",
      "depends_on": {
        "gateway": {
          "condition": "service_healthy"
        },
        "gateway-2": {
          "condition": "service_healthy"
        },
        "web": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS --cacert /run/secrets/edge-ca.pem --resolve \"$$APP_HOST:8443:127.0.0.1\" \"https://$$APP_HOST:8443/ready\" | grep -q ready"
        ],
        "interval": "10s",
        "timeout": "5s",
        "start_period": "10s",
        "retries": 6
      }
    }
  },
  "networks": {
    "backplane": {
      "name": "${PROD_NETWORK_NAME:?reviewed private network required}",
      "external": true
    }
  }
}
