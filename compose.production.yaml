{
  "name": "esep-platform-production-template",
  "x-purpose": "Preparation only. Never started automatically. External TLS Keycloak/PostgreSQL/Kafka/Redis must be provisioned and reviewed separately. No local data volumes are mounted.",
  "services": {
    "user": {
      "image": "${USER_IMAGE:?immutable image digest required}",
      "env_file": [
        "${PROD_ENV_DIR:?external per-service credentials required}/user.env"
      ],
      "environment": {
        "SPRING_PROFILES_ACTIVE": "production",
        "SERVER_SSL_KEY_STORE": "file:/run/secrets/service.p12",
        "JAVA_OPTS": "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${PROD_SECRETS_DIR:?external secret directory required}/user.p12",
          "target": "/run/secrets/service.p12",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "${PROD_SECRETS_DIR:?required}/service-ca.pem",
          "target": "/run/secrets/service-ca.pem",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "${PROD_SECRETS_DIR:?required}/database-ca.pem",
          "target": "/run/secrets/database-ca.pem",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "${PROD_SECRETS_DIR:?required}/cacerts",
          "target": "/opt/java/openjdk/lib/security/cacerts",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backplane"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:size=32m,mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "45s",
      "mem_limit": "512m",
      "cpus": 2,
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: user\\r\\nConnection: close\\r\\n\\r\\n' | openssl s_client -connect user:8083 -servername user -verify_hostname user -verify_return_error -CAfile /run/secrets/service-ca.pem -quiet 2>/dev/null | grep -q '\"status\":\"UP\"' "
        ],
        "interval": "10s",
        "timeout": "5s",
        "start_period": "120s",
        "retries": 12
      }
    },
    "user-migrate": {
      "image": "${USER_IMAGE:?required}",
      "profiles": [
        "migration"
      ],
      "env_file": [
        "${PROD_ENV_DIR:?required}/user-migration.env"
      ],
      "entrypoint": [
        "java",
        "-Xms32m",
        "-Xmx128m",
        "-XX:ActiveProcessorCount=1",
        "-Dloader.main=com.esep.ops.MigrateDatabase",
        "-cp",
        "/app/app.jar",
        "org.springframework.boot.loader.launch.PropertiesLauncher"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${PROD_SECRETS_DIR:?required}/database-ca.pem",
          "target": "/run/secrets/database-ca.pem",
          "read_only": true,
          "bind": {
            "create_host_path": false
