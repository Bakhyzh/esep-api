name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit + integration tests; Testcontainers starts PostgreSQL, Redis and Kafka on the runner's Docker
      - name: Test
        run: ./mvnw -B verify

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build Docker image
        run: docker build -t esep-api:ci .
