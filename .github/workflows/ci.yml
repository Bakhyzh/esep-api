name: CI

# pull requests: tests + compose validation + image build;
# main: the same job runs as the first stage of deploy.yml (workflow_call), so it is not duplicated here
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit + integration tests; Testcontainers starts PostgreSQL, Redis and Kafka on the runner's Docker
      - name: Test
        run: ./mvnw -B verify

      # the demo script is not run in CI; at least make sure a syntax error cannot be merged
      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Validate compose files
        run: |
          docker compose config -q
          # prod compose needs its variables; dummy values are enough to check the syntax
          cp .env.example .env.ci
          sed -i 's/^\(DB_PASSWORD\|JWT_SECRET\)=$/\1=ci-dummy-value-0123456789abcdef0123456789/' .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config -q

      - name: Build Docker image
        run: docker build -t esep-api:ci .

  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/ledger-service/pom.xml

      - name: Ledger unit, PostgreSQL concurrency, Flyway, RSA and Kafka integration
        run: ./mvnw -B -f services/ledger-service/pom.xml verify

      - name: Validate isolated Ledger configuration
        env:
          LEDGER_BOOTSTRAP_PASSWORD: ci-validation-placeholder-bootstrap
          LEDGER_MIGRATION_PASSWORD: ci-validation-placeholder-migration
          LEDGER_DB_PASSWORD: ci-validation-placeholder-runtime
        run: docker compose -f services/ledger-service/compose.yaml config -q

      - name: Scan committed Ledger sources for secrets
        run: |
          mkdir -p /tmp/ledger-scan
          git archive HEAD services/ledger-service docs/architecture/PHASE_3_1_LEDGER_DEPENDENCY_AUDIT.md docs/architecture/PHASE_3_1_LEDGER_EXTRACTION_REPORT.md .github/workflows/ci.yml | tar -x -C /tmp/ledger-scan
          docker run --rm -v /tmp/ledger-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner

      - name: Build independent Ledger image
        run: docker build -t esep-ledger:ci services/ledger-service

  user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/user-service/pom.xml
      - name: User authority integration and security
        run: ./mvnw -B -f services/user-service/pom.xml verify
      - name: Platform configuration
        env:
          PLATFORM_DB_BOOTSTRAP_PASSWORD: ci-placeholder-bootstrap
          USER_MIGRATION_PASSWORD: ci-placeholder-user-migration
          USER_DB_PASSWORD: ci-placeholder-user-runtime
          LEDGER_MIGRATION_PASSWORD: ci-placeholder-ledger-migration
          LEDGER_DB_PASSWORD: ci-placeholder-ledger-runtime
          LEDGER_IDENTITY_DB_PASSWORD: ci-placeholder-projector
          NOTIFICATION_MIGRATION_PASSWORD: ci-placeholder-notification-migration
          NOTIFICATION_DB_PASSWORD: ci-placeholder-notification-runtime
          NOTIFICATION_IDENTITY_DB_PASSWORD: ci-placeholder-notification-projector
          ANALYTICS_MIGRATION_PASSWORD: ci-placeholder-analytics-migration
          ANALYTICS_DB_PASSWORD: ci-placeholder-analytics-runtime
          ANALYTICS_IDENTITY_DB_PASSWORD: ci-placeholder-analytics-projector
          REDIS_PASSWORD: ci-placeholder-cache
          PLATFORM_FRONTEND_CONTEXT: ./frontend
          PLATFORM_BACKUP_PASSWORD: ci-placeholder-backup
          PLATFORM_OPS_PASSWORD: ci-placeholder-monitor
          PLATFORM_RESTORE_PASSWORD: ci-placeholder-restore
        run: docker compose -f compose.platform.yaml config -q
      - name: User committed-source secret scan
        run: |
          mkdir -p /tmp/user-scan
          git archive HEAD services/user-service compose.platform.yaml infrastructure/platform contracts/events tests/e2e/identity-flow.py docs/architecture/PHASE_A_USER_SERVICE_REPORT.md | tar -x -C /tmp/user-scan
          docker run --rm -v /tmp/user-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
      - name: Independent User image
        run: docker build -t esep-user:ci services/user-service

  notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/notification-service/pom.xml
      - name: Notification PostgreSQL, Kafka, ownership, retry and DLT tests
        run: ./mvnw -B -f services/notification-service/pom.xml verify
      - name: Notification source security scan
        run: |
          mkdir -p /tmp/notification-scan
          git archive HEAD services/notification-service docs/architecture/PHASE_B_NOTIFICATION_SERVICE_REPORT.md | tar -x -C /tmp/notification-scan
          docker run --rm -v /tmp/notification-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
      - name: Independent Notification image
        run: docker build -t esep-notification:ci services/notification-service

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/analytics-service/pom.xml
      - name: Analytics PostgreSQL, Kafka, Redis, precision and projection tests
        run: ./mvnw -B -f services/analytics-service/pom.xml verify
      - name: Analytics source security scan
        run: |
          mkdir -p /tmp/analytics-scan
          git archive HEAD services/analytics-service docs/architecture/PHASE_C_ANALYTICS_SERVICE_REPORT.md | tar -x -C /tmp/analytics-scan
          docker run --rm -v /tmp/analytics-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
      - name: Independent Analytics image
        run: docker build -t esep-analytics:ci services/analytics-service

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      - name: Gateway real HTTP, JWT cryptography, JWKS rotation and Redis fault tests
        run: ./mvnw -B -f services/api-gateway/pom.xml verify
      - name: Gateway committed-source secret scan
        run: |
          mkdir -p /tmp/gateway-scan
          git archive HEAD services/api-gateway docs/architecture/PHASE_D_GATEWAY_REPORT.md | tar -x -C /tmp/gateway-scan
          docker run --rm -v /tmp/gateway-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
      - name: Independent Gateway image
        run: docker build -t esep-gateway:ci services/api-gateway

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned Nginx configuration under non-root read-only runtime
        run: |
          docker run --rm --user nginx --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            -v "$PWD/infrastructure/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --entrypoint nginx nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 -t
      - name: Scan edge configuration
        run: |
          mkdir -p /tmp/edge-scan
          git archive HEAD infrastructure/edge infrastructure/platform/configure-edge-client.py tests/e2e/replica-failures.py docs/architecture/PHASE_E_EDGE_SCALING_REPORT.md | tar -x -C /tmp/edge-scan
          docker run --rm -v /tmp/edge-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: infrastructure/ops-tests/pom.xml
      - name: Fresh PostgreSQL role boundaries, four Flyway histories, timeout rollback and connection budgets
        run: ./mvnw -B -f infrastructure/ops-tests/pom.xml verify
      - name: Install supported backup encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Real encrypted artifact and retention security tests
        run: python3 -m unittest discover -s infrastructure/ops -p 'test_*.py'
      - name: Real isolated named-point WAL recovery and verified physical backup
        run: python3 infrastructure/ops/pitr-lab.py
      - name: Verify operator helper syntax and scan committed sources
        run: |
          python3 -m py_compile infrastructure/ops/*.py
          mkdir -p /tmp/ops-scan
          git archive HEAD infrastructure/ops infrastructure/ops-tests docs/runbooks/platform-operations.md docs/architecture/PHASE_F_RECOVERY_REPORT.md | tar -x -C /tmp/ops-scan
          docker run --rm -v /tmp/ops-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate platform and optional monitoring Compose without starting services
        run: python3 infrastructure/platform/validate-config.py
      - name: Validate pinned telemetry configurations and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infrastructure/observability:/config:ro" -w /config prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 check rules alerts.yaml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infrastructure/observability:/config:ro" -w /config prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 test rules alerts.test.yaml
          docker run --rm -v "$PWD/infrastructure/observability/collector.yaml:/config.yaml:ro" otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b validate --config=/config.yaml
          docker run --rm -v "$PWD/infrastructure/observability/loki.yaml:/config.yaml:ro" grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28 -config.file=/config.yaml -verify-config
      - name: Validate full and compact Prometheus target configurations
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infrastructure/observability:/etc/prometheus:ro" prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 check config /etc/prometheus/prometheus.yaml /etc/prometheus/prometheus-compact.yaml
      - name: Validate Jaeger v2 configuration
        run: docker run --rm -v "$PWD/infrastructure/observability/jaeger.yaml:/config.yaml:ro" jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e validate --config=/config.yaml
      - name: Scan monitoring configuration and smoke helper
        run: |
          python3 -m py_compile tests/observability/verify.py infrastructure/platform/validate-config.py
          mkdir -p /tmp/observability-scan
          git archive HEAD infrastructure/observability tests/observability compose.monitoring.yaml compose.monitoring-compact.yaml docs/architecture/OBSERVABILITY.md docs/architecture/PHASE_G_OBSERVABILITY_REPORT.md | tar -x -C /tmp/observability-scan
          docker run --rm -v /tmp/observability-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
