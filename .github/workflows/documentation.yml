name: Documentation
on:
  push:
    paths: ['docs/**', README.md]
  pull_request:
    paths: ['docs/**', README.md]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/documentation/validate.py
      - name: Scan tracked documentation for secrets
        run: |
          mkdir -p /tmp/documentation-scan
          git archive HEAD docs README.md | tar -x -C /tmp/documentation-scan
          docker run --rm -v /tmp/documentation-scan:/scan:ro ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --no-banner
