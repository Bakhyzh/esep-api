extensions:
  jaeger_storage:
    backends:
      local:
        memory: {max_traces: 2000}
  jaeger_query:
    storage: {traces: local}
    http: {endpoint: '0.0.0.0:16686'}
receivers:
  otlp:
    protocols:
      grpc: {endpoint: '0.0.0.0:4317'}
exporters:
  jaeger_storage_exporter: {trace_storage: local}
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces: {receivers: [otlp], exporters: [jaeger_storage_exporter]}
