worker_processes 1;
worker_shutdown_timeout 20s;
pid /tmp/nginx.pid;
# Avoid logging token-bearing callback queries or financial request paths on transport errors.
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $route_group {
        default web;
        ~^/api/auth/ user;
        ~^/api/users/ user;
        ~^/api/accounts ledger;
        ~^/api/transfers ledger;
        ~^/api/deposits ledger;
        ~^/api/transactions ledger;
        ~^/api/analytics/ analytics;
        ~^/api/notifications notification;
    }
    log_format safe escape=json '{"service":"edge","route":"$route_group","method":"$request_method","status":$status,"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:1m;
    upstream gateways {
        zone gateways 64k;
        server gateway:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-2:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
    }
    upstream frontend {
        zone frontend 32k;
        server web:8080 resolve;
        keepalive 8;
    }
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        client_max_body_size 64k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        # Local HTTP dev policy only. Production requires approved HTTPS origins and TLS configuration.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8180; frame-src http://localhost:8180; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180" always;
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|OPTIONS)$) { return 405; }
        location = /health { access_log off; default_type text/plain; return 200 'healthy'; }
        location = /ready {
            access_log off;
            proxy_pass http://gateways/actuator/health/readiness;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
        }
        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }
        location = /api { return 404; }
        location /api/ {
            limit_req zone=api_rate burst=120 nodelay;
            limit_req_status 429;
            limit_conn api_connections 64;
            limit_conn_status 429;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded '';
            proxy_set_header X-User-Id '';
            proxy_set_header X-User-Role '';
            proxy_request_buffering on;
            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
            # Never enable non_idempotent. Already-sent POST/PATCH requests are not replayed.
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://gateways;
        }
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_pass http://frontend;
        }
    }
}
