name: esep-platform-local
services:
  postgres:
    image: esep-platform-postgres:local
    build: ./infrastructure/platform/postgres
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, max_connections=80, -c, log_min_duration_statement=500, -c, log_statement=none, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    environment:
      PLATFORM_BACKUP_PASSWORD: ${PLATFORM_BACKUP_PASSWORD:?required}
      PLATFORM_OPS_PASSWORD: ${PLATFORM_OPS_PASSWORD:?required}
      PLATFORM_RESTORE_PASSWORD: ${PLATFORM_RESTORE_PASSWORD:?required}
      POSTGRES_USER: platform_bootstrap
      POSTGRES_PASSWORD: ${PLATFORM_DB_BOOTSTRAP_PASSWORD:?required}
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      NOTIFICATION_IDENTITY_DB_PASSWORD: ${NOTIFICATION_IDENTITY_DB_PASSWORD:?required}
      ANALYTICS_MIGRATION_PASSWORD: ${ANALYTICS_MIGRATION_PASSWORD:?required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
      ANALYTICS_IDENTITY_DB_PASSWORD: ${ANALYTICS_IDENTITY_DB_PASSWORD:?required}
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
      - ./infrastructure/platform/postgres-init.sql:/docker-entrypoint-initdb.d/10-platform.sql:ro
      - ./infrastructure/ops/roles.sql:/docker-entrypoint-initdb.d/20-ops.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U platform_bootstrap -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  kafka:
    image: esep-platform-kafka:local
    build: ./infrastructure/platform/kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:broker;User:operator
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms192m -Xmx256m
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?required}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?required}
      KAFKA_USER_PASSWORD: ${KAFKA_USER_PASSWORD:?required}
      KAFKA_LEDGER_PASSWORD: ${KAFKA_LEDGER_PASSWORD:?required}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD:?required}
      KAFKA_ANALYTICS_PASSWORD: ${KAFKA_ANALYTICS_PASSWORD:?required}
      KAFKA_MONITOR_PASSWORD: ${KAFKA_MONITOR_PASSWORD:?required}
    command: [bash, /opt/esep/kafka/start.sh]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    volumes:
      - ./infrastructure/platform/kafka/start.sh:/opt/esep/kafka/start.sh:ro
      - platform-kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/esep-kafka-admin.properties > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 448m
  kafka-init:
    image: esep-platform-kafka:local
    entrypoint: [bash, /opt/esep/kafka/init.sh]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?required}
    volumes: [./infrastructure/platform/kafka/init.sh:/opt/esep/kafka/init.sh:ro]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      kafka: {condition: service_healthy}
    mem_limit: 160m
  user:
    build: ./services/user-service
    environment:
      USER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_USERNAME: user_runtime
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      USER_MIGRATION_USERNAME: user_migrator
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="${KAFKA_USER_PASSWORD:?required}";'
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  ledger:
    image: esep-platform-ledger:local
    build: ./services/ledger-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USERNAME: ledger_runtime
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_USERNAME: ledger_migrator
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="ledger" password="${KAFKA_LEDGER_PASSWORD:?required}";'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      LEDGER_INSTANCE: ledger-1
      LEDGER_IDENTITY_ENABLED: true
      LEDGER_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_IDENTITY_DB_USERNAME: ledger_projector
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  notification:
    build: ./services/notification-service
    environment:
      NOTIFICATION_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_runtime
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      NOTIFICATION_MIGRATION_USERNAME: notification_migrator
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?required}
      NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="notification" password="${KAFKA_NOTIFICATION_PASSWORD:?required}";'
      NOTIFICATION_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_IDENTITY_DB_USERNAME: notification_projector
      NOTIFICATION_IDENTITY_DB_PASSWORD: ${NOTIFICATION_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18084:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  analytics:
    build: ./services/analytics-service
    environment:
      ANALYTICS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_DB_USERNAME: analytics_runtime
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
      ANALYTICS_MIGRATION_USERNAME: analytics_migrator
      ANALYTICS_MIGRATION_PASSWORD: ${ANALYTICS_MIGRATION_PASSWORD:?required}
      ANALYTICS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="analytics" password="${KAFKA_ANALYTICS_PASSWORD:?required}";'
      ANALYTICS_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_IDENTITY_DB_USERNAME: analytics_projector
      ANALYTICS_IDENTITY_DB_PASSWORD: ${ANALYTICS_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      ANALYTICS_LEDGER_BASE_URL: http://ledger:8082
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18085:8085"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m
  gateway:
    image: esep-platform-gateway:local
    build: ./services/api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: replicated
      GATEWAY_CORS_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_BASE_URL: http://user:8083
      LEDGER_BASE_URL: lb://ledger
      ANALYTICS_BASE_URL: http://analytics:8085
      NOTIFICATION_BASE_URL: http://notification:8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      GATEWAY_INSTANCE: gateway-1
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      user: {condition: service_healthy}
      ledger: {condition: service_healthy}
      notification: {condition: service_healthy}
      analytics: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 320m
  ledger-2:
    image: esep-platform-ledger:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USERNAME: ledger_runtime
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_USERNAME: ledger_migrator
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="ledger" password="${KAFKA_LEDGER_PASSWORD:?required}";'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      LEDGER_INSTANCE: ledger-2
      LEDGER_IDENTITY_ENABLED: true
      LEDGER_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_IDENTITY_DB_USERNAME: ledger_projector
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  gateway-2:
    image: esep-platform-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: replicated
      GATEWAY_CORS_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_BASE_URL: http://user:8083
      LEDGER_BASE_URL: lb://ledger
      ANALYTICS_BASE_URL: http://analytics:8085
      NOTIFICATION_BASE_URL: http://notification:8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      GATEWAY_INSTANCE: gateway-2
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    depends_on:
      user: {condition: service_healthy}
      ledger: {condition: service_healthy}
      notification: {condition: service_healthy}
      analytics: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 320m
  web:
    image: esep-platform-web:local
    build:
      context: ${PLATFORM_FRONTEND_CONTEXT:?verified frontend checkout required}
    mem_limit: 64m
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  edge:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: nginx
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    ports: ["127.0.0.1:18081:8080"]
    volumes: [./infrastructure/edge/nginx.conf:/etc/nginx/nginx.conf:ro]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    depends_on:
      gateway: {condition: service_healthy}
      gateway-2: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/ready | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m
  dba-toolbox:
    profiles: [dba]
    image: postgres:17.11-alpine@sha256:562a6e0a66b5136bc28bef5944bbc2ddddf8ea0058d4016b96cee63f2edaf143
    entrypoint: [sleep]
    command: [infinity]
    environment:
      PGHOST: postgres
      PGDATABASE: ledger_db
      PGUSER: platform_ops
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m

volumes:
  platform-pgdata:
  platform-kafka:
networks:
  identity:
    external: true
    name: esep-identity-dev_identity
