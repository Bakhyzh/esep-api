name: esep-platform-local
services:
  postgres:
    image: postgres:17-alpine
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, max_connections=80, -c, log_min_duration_statement=500, -c, log_statement=none]
    environment:
      POSTGRES_USER: platform_bootstrap
      POSTGRES_PASSWORD: ${PLATFORM_DB_BOOTSTRAP_PASSWORD:?required}
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      NOTIFICATION_IDENTITY_DB_PASSWORD: ${NOTIFICATION_IDENTITY_DB_PASSWORD:?required}
      ANALYTICS_MIGRATION_PASSWORD: ${ANALYTICS_MIGRATION_PASSWORD:?required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
      ANALYTICS_IDENTITY_DB_PASSWORD: ${ANALYTICS_IDENTITY_DB_PASSWORD:?required}
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
      - ./infrastructure/platform/postgres-init.sql:/docker-entrypoint-initdb.d/10-platform.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_bootstrap -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms192m -Xmx256m
    volumes:
      - platform-kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 448m
  user:
    build: ./services/user-service
    environment:
      USER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_USERNAME: user_runtime
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      USER_MIGRATION_USERNAME: user_migrator
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  ledger:
    image: esep-platform-ledger:local
    build: ./services/ledger-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USERNAME: ledger_runtime
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_USERNAME: ledger_migrator
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_INSTANCE: ledger-1
      LEDGER_IDENTITY_ENABLED: true
      LEDGER_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_IDENTITY_DB_USERNAME: ledger_projector
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  notification:
    build: ./services/notification-service
    environment:
      NOTIFICATION_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_runtime
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      NOTIFICATION_MIGRATION_USERNAME: notification_migrator
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?required}
      NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_IDENTITY_DB_USERNAME: notification_projector
      NOTIFICATION_IDENTITY_DB_PASSWORD: ${NOTIFICATION_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18084:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  analytics:
    build: ./services/analytics-service
    environment:
      ANALYTICS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_DB_USERNAME: analytics_runtime
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
      ANALYTICS_MIGRATION_USERNAME: analytics_migrator
      ANALYTICS_MIGRATION_PASSWORD: ${ANALYTICS_MIGRATION_PASSWORD:?required}
      ANALYTICS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYTICS_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_IDENTITY_DB_USERNAME: analytics_projector
      ANALYTICS_IDENTITY_DB_PASSWORD: ${ANALYTICS_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      ANALYTICS_LEDGER_BASE_URL: http://ledger:8082
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18085:8085"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m
  gateway:
    image: esep-platform-gateway:local
    build: ./services/api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: replicated
      GATEWAY_CORS_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_BASE_URL: http://user:8083
      LEDGER_BASE_URL: lb://ledger
      ANALYTICS_BASE_URL: http://analytics:8085
      NOTIFICATION_BASE_URL: http://notification:8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      GATEWAY_INSTANCE: gateway-1
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      user: {condition: service_healthy}
      ledger: {condition: service_healthy}
      notification: {condition: service_healthy}
      analytics: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 320m
  ledger-2:
    image: esep-platform-ledger:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:18081
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USERNAME: ledger_runtime
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_USERNAME: ledger_migrator
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_INSTANCE: ledger-2
      LEDGER_IDENTITY_ENABLED: true
      LEDGER_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_IDENTITY_DB_USERNAME: ledger_projector
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 384m
  gateway-2:
    image: esep-platform-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: replicated
      GATEWAY_CORS_ORIGINS: http://localhost:5173,http://localhost:18081
      USER_BASE_URL: http://user:8083
      LEDGER_BASE_URL: lb://ledger
      ANALYTICS_BASE_URL: http://analytics:8085
      NOTIFICATION_BASE_URL: http://notification:8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      GATEWAY_INSTANCE: gateway-2
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    depends_on:
      user: {condition: service_healthy}
      ledger: {condition: service_healthy}
      notification: {condition: service_healthy}
      analytics: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [default, identity]
    stop_grace_period: 45s
    mem_limit: 320m
  web:
    image: esep-platform-web:local
    build:
      context: ${PLATFORM_FRONTEND_CONTEXT:?verified frontend checkout required}
    mem_limit: 64m
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  edge:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: nginx
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    ports: ["127.0.0.1:18081:8080"]
    volumes: [./infrastructure/edge/nginx.conf:/etc/nginx/nginx.conf:ro]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    depends_on:
      gateway: {condition: service_healthy}
      gateway-2: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/ready | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m

volumes:
  platform-pgdata:
  platform-kafka:
networks:
  identity:
    external: true
    name: esep-identity-dev_identity
