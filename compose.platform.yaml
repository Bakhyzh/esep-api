name: esep-platform-local
services:
  postgres:
    image: postgres:17-alpine
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, max_connections=80, -c, log_min_duration_statement=500, -c, log_statement=none]
    environment:
      POSTGRES_USER: platform_bootstrap
      POSTGRES_PASSWORD: ${PLATFORM_DB_BOOTSTRAP_PASSWORD:?required}
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
      - ./infrastructure/platform/postgres-init.sql:/docker-entrypoint-initdb.d/10-platform.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_bootstrap -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms192m -Xmx256m
    volumes:
      - platform-kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 448m
  user:
    build: ./services/user-service
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_USERNAME: user_runtime
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required}
      USER_MIGRATION_USERNAME: user_migrator
      USER_MIGRATION_PASSWORD: ${USER_MIGRATION_PASSWORD:?required}
      USER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    mem_limit: 384m
  ledger:
    build: ./services/ledger-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USERNAME: ledger_runtime
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?required}
      LEDGER_MIGRATION_USERNAME: ledger_migrator
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?required}
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_IDENTITY_ENABLED: true
      LEDGER_IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_IDENTITY_DB_USERNAME: ledger_projector
      LEDGER_IDENTITY_DB_PASSWORD: ${LEDGER_IDENTITY_DB_PASSWORD:?required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/esep}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/esep/protocol/openid-connect/certs
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:18082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [default, identity]
    mem_limit: 448m
volumes:
  platform-pgdata:
  platform-kafka:
networks:
  identity:
    external: true
    name: esep-identity-dev_identity
