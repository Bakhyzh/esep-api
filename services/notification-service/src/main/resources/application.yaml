spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    locations: classpath:db/notification
    user: ${NOTIFICATION_MIGRATION_USERNAME:${NOTIFICATION_DB_USERNAME}}
    password: ${NOTIFICATION_MIGRATION_PASSWORD:${NOTIFICATION_DB_PASSWORD}}
  kafka:
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000
server:
  shutdown: graceful
  port: ${SERVER_PORT:8084}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health:
    probes.enabled: true
    show-details: never
    group.readiness.include: readinessState,db
esep:
  cors:
    allowed-origins: ${NOTIFICATION_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-age: 1h
  security.keycloak:
    issuer-uri: ${OIDC_ISSUER_URI}
    jwk-set-uri: ${OIDC_JWK_SET_URI}
  identity:
    enabled: true
    group: esep-notification-identities-v1
    jdbc-url: ${NOTIFICATION_IDENTITY_DB_URL:}
    username: ${NOTIFICATION_IDENTITY_DB_USERNAME:}
    password: ${NOTIFICATION_IDENTITY_DB_PASSWORD:}
  notification:
    transfers-topic: esep.ledger.transfers.v1
    replay-topic: esep.notifications.replay.v1
