spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USERNAME}
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/ledger
    user: ${LEDGER_MIGRATION_USERNAME:${LEDGER_DB_USERNAME}}
    password: ${LEDGER_MIGRATION_PASSWORD:${LEDGER_DB_PASSWORD}}
  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000
server:
  shutdown: graceful
  port: ${SERVER_PORT:8082}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: never
    group.readiness.include: readinessState,db
esep:
  cors:
    allowed-origins: ${LEDGER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-age: 1h
  security.keycloak:
    issuer-uri: ${OIDC_ISSUER_URI}
    jwk-set-uri: ${OIDC_JWK_SET_URI}
  outbox:
    topic: ${LEDGER_TRANSFERS_TOPIC:esep.ledger.transfers.v1}
    poll-interval: 1s
    batch-size: 100
    send-timeout: 2s
    publisher-enabled: ${LEDGER_OUTBOX_ENABLED:true}

  identity:
    enabled: ${LEDGER_IDENTITY_ENABLED:false}
    jdbc-url: ${LEDGER_IDENTITY_DB_URL:}
    username: ${LEDGER_IDENTITY_DB_USERNAME:}
    password: ${LEDGER_IDENTITY_DB_PASSWORD:}

logging:
  structured.format.console: ecs
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.springframework.kafka.listener: "OFF"
management.tracing.export.enabled: false
management.tracing.export.otlp.enabled: false
management.opentelemetry.enabled: false
management.logging.export.otlp.enabled: false
management.otlp.metrics.export.enabled: false
management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.slo.http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
