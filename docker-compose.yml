services:
  postgres:
    image: postgres:17-alpine
    container_name: esep-postgres
    environment:
      POSTGRES_DB: esep
      POSTGRES_USER: esep
      POSTGRES_PASSWORD: esep
    ports:
      - "5432:5432"
    volumes:
      - esep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esep -d esep"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  esep-pgdata:
