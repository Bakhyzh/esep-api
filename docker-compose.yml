services:
  postgres:
    image: postgres:17-alpine
    container_name: esep-postgres
    environment:
      POSTGRES_DB: esep
      POSTGRES_USER: esep
      POSTGRES_PASSWORD: esep
    ports:
      - "5432:5432"
    volumes:
      - esep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esep -d esep"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: esep-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # single-node Kafka in KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:3.9.1
    container_name: esep-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for containers (kafka:9092), EXTERNAL for the app started from an IDE (localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  app:
    build: .
    container_name: esep-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # inside the compose network the database host is the service name, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/esep
      DB_USERNAME: esep
      DB_PASSWORD: esep
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # dev = demo users from the seed migration; for anything real use a non-dev profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # demo default only; pass your own: JWT_SECRET=... docker compose up
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-0123456789abcdef}
    ports:
      - "${APP_PORT:-8081}:8081"

volumes:
  esep-pgdata:
